name: Gerar Chave de Assinatura Android (1 única vez)

on:
  workflow_dispatch:

jobs:
  gerar-keystore:
    name: Criar Keystore Release (.jks)
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Keystore segura e instruções dos Secrets
        run: |
          mkdir -p out
          SENHA=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          ALIAS="caderno-unirversos"

          keytool -genkeypair -v \
            -keystore out/caderno-unirversos-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$SENHA" \
            -keypass "$SENHA" \
            -dname "CN=Caderno Unirversos, OU=Unirversos, O=Unirversos, L=Sao Paulo, ST=SP, C=BR"

          B64=$(base64 -w 0 out/caderno-unirversos-release.jks)

          cat <<EOF > out/SECRETS-GITHUB.txt
          GUARDE O ARQUIVO caderno-unirversos-release.jks EM UM LOCAL SEGURO (ex.: Google Drive)!
          Se perder essa chave, não conseguirá enviar atualizações do mesmo app nas lojas.

          Cole estes 4 Secrets em:
          GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret

          1) Nome: ANDROID_KEY_ALIAS
             Valor: $ALIAS

          2) Nome: ANDROID_KEYSTORE_PASSWORD
             Valor: $SENHA

          3) Nome: ANDROID_KEY_PASSWORD
             Valor: $SENHA

          4) Nome: ANDROID_KEYSTORE_BASE64
             Valor:
          $B64
          EOF

      - name: Salvar Keystore por 1 dia para você baixar
        uses: actions/upload-artifact@v4
        with:
          name: CHAVE-RELEASE-GUARDAR-SEGURO
          path: out/
          retention-days: 1
