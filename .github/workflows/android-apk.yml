name: Gerar APK Android (Gratuito)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar Caderno-Unirversos.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 17 (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Compilar APK (Release assinado ou Teste)
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "→ Gerando APK Release ASSINADO (pronto para Galaxy Store / Amazon / Site)..."
            export KEYSTORE_PATH="/tmp/caderno-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Caderno-Unirversos.apk
            rm -f "$KEYSTORE_PATH"
          else
            echo "→ Gerando APK de Teste (sem chave release configurada)..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Caderno-Unirversos.apk
          fi

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Caderno-Unirversos-APK
          path: Caderno-Unirversos.apk
          retention-days: 90
